<!DOCTYPE html>
<html>
<head><title>Vidking Test</title></head>
<body>
  <h1>Vidking Player Test</h1>
  <iframe src="https://vidking.net/embed/movie/862" width="800" height="450" frameborder="0" allowfullscreen></iframe>
  <div id="log"></div>
  <script>
    window.addEventListener("message", function(event) {
      console.log("Message:", event.data);
      const log = document.getElementById("log");
      const div = document.createElement("div");
      div.innerText = typeof event.data === 'string' ? event.data : JSON.stringify(event.data);
      log.appendChild(div);
    });
  </script>
</body>
</html>
